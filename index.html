<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 이벤트 알리미</title>
    <style>
        /* 전체적인 디자인 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        p {
            color: #7f8c8d;
            margin-top: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 카드 박스 디자인 */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 320px;
        }

        h2 {
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
            margin-top: 0;
        }

        /* 입력 폼 스타일 */
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #555;
        }

        input, select {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        /* 이벤트 리스트 스타일 */
        .event-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 카테고리별 색상 포인트 */
        .event-item.축제 { border-left-color: #e74c3c; }
        .event-item.시험 { border-left-color: #f39c12; }
        .event-item.동아리 { border-left-color: #2ecc71; }
        .event-item.기타 { border-left-color: #9b59b6; }

        .event-info h4 {
            margin: 0 0 4px 0;
            color: #2c3e50;
            font-size: 16px;
        }

        .event-info .date {
            font-size: 13px;
            color: #888;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            margin-bottom: 4px;
            display: inline-block;
        }
        .badge.축제 { background-color: #e74c3c; }
        .badge.시험 { background-color: #f39c12; }
        .badge.동아리 { background-color: #2ecc71; }
        .badge.기타 { background-color: #9b59b6; }

        .btn-delete {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: #aaa;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎉 학교 이벤트 알리미</h1>
        <p>우리 학교의 다채로운 행사와 일정을 한눈에 확인하세요!</p>
    </header>

    <div class="container">
        <!-- 이벤트 등록 카드 -->
        <div class="card">
            <h2>📅 이벤트 등록하기</h2>
            <div class="form-group">
                <label>이벤트 이름</label>
                <input type="text" id="eventTitle" placeholder="예: 봄 소풍, 축제, 중간고사">
            </div>
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="eventDate">
            </div>
            <div class="form-group">
                <label>카테고리</label>
                <select id="eventCategory">
                    <option value="축제">축제/행사</option>
                    <option value="시험">시험</option>
                    <option value="동아리">동아리 활동</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <button class="btn-submit" onclick="addEvent()">이벤트 등록</button>
        </div>

        <!-- 이벤트 목록 카드 -->
        <div class="card">
            <h2>📢 학교 이벤트 목록</h2>
            <ul id="eventList" class="event-list">
                <div class="empty-msg" id="emptyMsg">등록된 이벤트가 없습니다.</div>
            </ul>
        </div>
    </div>

    <script>
        // 이벤트를 저장할 배열 (웹페이지를 끄기 전까지 유지됨)
        let events = [];

        function addEvent() {
            const titleInput = document.getElementById('eventTitle');
            const dateInput = document.getElementById('eventDate');
            const categorySelect = document.getElementById('eventCategory');

            const title = titleInput.value.trim();
            const date = dateInput.value;
            const category = categorySelect.value;

            // 유효성 검사
            if (title === '' || date === '') {
                alert('이벤트 이름과 날짜를 모두 입력해주세요!');
                return;
            }

            // 이벤트 객체 생성
            const newEvent = {
                id: Date.now(), // 고유 번호
                title: title,
                date: date,
                category: category
            };

            events.push(newEvent);

            // 날짜 순으로 정렬 (가까운 날짜가 위로 오도록)
            events.sort((a, b) => new Date(a.date) - new Date(b.date));

            // 입력창 초기화 및 화면 갱신
            titleInput.value = '';
            dateInput.value = '';
            renderEvents();
        }

        function deleteEvent(id) {
            events = events.filter(event => event.id !== id);
            renderEvents();
        }

        function renderEvents() {
            const eventList = document.getElementById('eventList');
            const emptyMsg = document.getElementById('emptyMsg');

            eventList.innerHTML = '';

            if (events.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            } else {
                emptyMsg.style.display = 'none';
            }

            events.forEach(event => {
                const li = document.createElement('li');
                li.className = `event-item ${event.category}`;

                li.innerHTML = `
                    <div class="event-info">
                        <span class="badge ${event.category}">${event.category}</span>
                        <h4>${event.title}</h4>
                        <div class="date">📅 ${event.date}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteEvent(${event.id})">삭제</button>
                `;

                eventList.appendChild(li);
            });
        }
    </script>

</body>
</html>
