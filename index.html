<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 공부 타이머 & 투두리스트</title>
    <style>
        /* 전체적인 디자인과 스타일 설정 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        p {
            color: #7f8c8d;
            margin-top: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 카드 박스 디자인 */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }

        /* 타이머 스타일 */
        .timer-input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .timer-input-area input {
            width: 100px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #3498db;
        }

        .timer-btns, .todo-input-area {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-set { background-color: #3498db; color: white; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-pause { background-color: #e74c3c; color: white; }
        .btn-reset { background-color: #95a5a6; color: white; }
        button:hover { opacity: 0.9; }

        /* 투두리스트 스타일 */
        .todo-input-area input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .btn-add { background-color: #3498db; color: white; }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }

        li.completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        .btn-delete {
            background: none;
            color: #e74c3c;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>📚 스터디 메이트</h1>
    <p>공부 시간을 설정하고 오늘 할 일을 관리해보세요!</p>

    <div class="container">
        <!-- 공부 타이머 카드 -->
        <div class="card">
            <h2>⏱️ 직접 설정 타이머</h2>
            
            <!-- 시간 입력 영역 추가 -->
            <div class="timer-input-area">
                <input type="number" id="minuteInput" placeholder="분 입력" min="1" max="180" value="25">
                <button class="btn-set" onclick="setTime()">시간 설정</button>
            </div>

            <div class="timer-display" id="timer">25:00</div>
            
            <div class="timer-btns">
                <button class="btn-start" onclick="startTimer()">시작</button>
                <button class="btn-pause" onclick="pauseTimer()">일시정지</button>
                <button class="btn-reset" onclick="resetTimer()">초기화</button>
            </div>
        </div>

        <!-- 할 일 목록 카드 -->
        <div class="card">
            <h2>📝 오늘의 할 일</h2>
            <div class="todo-input-area">
                <input type="text" id="todoInput" placeholder="할 일을 입력하세요..." onkeypress="handleKeyPress(event)">
                <button class="btn-add" onclick="addTodo()">추가</button>
            </div>
            <ul id="todoList"></ul>
        </div>
    </div>

    <script>
        // --- 1. 타이머 자바스크립트 기능 (수정됨) ---
        let timeLeft = 25 * 60; // 기본값 25분
        let initialTime = 25 * 60; // 초기화나 재설정을 위한 저장용
        let timerId = null;
        const timerDisplay = document.getElementById('timer');

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 사용자가 입력한 분으로 타이머를 설정하는 함수
        function setTime() {
            const minuteInput = document.getElementById('minuteInput');
            const minutes = parseInt(minuteInput.value);

            if (isNaN(minutes) || minutes <= 0) {
                alert('올바른 분(숫자)을 입력해주세요!');
                return;
            }

            pauseTimer(); // 설정 중에는 타이머 멈춤
            timeLeft = minutes * 60;
            initialTime = timeLeft; // 초기화 버튼을 눌렀을 때 이 시간으로 돌아오도록 저장
            updateTimerDisplay();
        }

        function startTimer() {
            if (timerId !== null) return; 
            
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    alert('🎉 설정한 공부 시간이 완료되었습니다! 잠시 휴식하세요.');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = initialTime; // 마지막으로 설정했던 시간으로 되돌림
            updateTimerDisplay();
        }


        // --- 2. 할 일 목록(To-Do List) 자바스크립트 기능 ---
        function addTodo() {
            const input = document.getElementById('todoInput');
            const todoText = input.value.trim();

            if (todoText === '') {
                alert('할 일을 입력해주세요!');
                return;
            }

            const ul = document.getElementById('todoList');
            const li = document.createElement('li');

            li.innerHTML = `
                <span onclick="toggleComplete(this)" style="cursor:pointer; flex:1;">${todoText}</span>
                <button class="btn-delete" onclick="deleteTodo(this)">삭제</button>
            `;

            ul.appendChild(li);
            input.value = '';
        }

        function toggleComplete(element) {
            element.parentElement.classList.toggle('completed');
        }

        function deleteTodo(button) {
            button.parentElement.remove();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTodo();
            }
        }
    </script>

</body>
</html>
