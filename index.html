<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 이벤트 & 기한 관리 허브</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for clean dashboard look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">스쿨이벤트 허브</h1>
                    <p class="text-xs text-slate-500">자동 알림 정리 및 기한(D-Day) 통합 관리 시스템</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openSimulationModal()" class="inline-flex items-center space-x-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-2 rounded-xl text-sm font-semibold transition border border-indigo-200 shadow-xs">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.655V5a2 2 0 10-4 0v.345C7.670.765 6 3.122 6 6v8.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span>새 알림 시뮬레이션</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT PANEL: Auto-organized notifications & incoming events (5 cols) -->
        <section class="lg:col-span-5 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-amber-500 rounded-full animate-pulse"></div>
                    <h2 class="font-bold text-slate-800 text-base">수신된 알림 & 이벤트 피드</h2>
                </div>
                <span id="inbox-count" class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">0건 대기</span>
            </div>

            <!-- Filter tabs for inbox -->
            <div class="px-5 py-3 border-b border-slate-100 flex space-x-2 overflow-x-auto text-xs">
                <button onclick="filterInbox('all')" id="inbox-filter-all" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white font-medium transition whitespace-nowrap">전체</button>
                <button onclick="filterInbox('축제')" id="inbox-filter-축제" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition whitespace-nowrap">축제/행사</button>
                <button onclick="filterInbox('시험')" id="inbox-filter-시험" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition whitespace-nowrap">시험/평가</button>
                <button onclick="filterInbox('동아리')" id="inbox-filter-동아리" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition whitespace-nowrap">동아리</button>
                <button onclick="filterInbox('행정')" id="inbox-filter-행정" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition whitespace-nowrap">학교행정</button>
            </div>

            <!-- Inbox list container -->
            <div id="inbox-list" class="flex-1 overflow-y-auto p-4 space-y-3 max-h-[calc(100vh-280px)]">
                <!-- Dynamically populated inbox items -->
            </div>
            
            <div class="p-3 bg-slate-50 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400">이벤트를 확인하고 "기간 설정 및 등록"을 눌러 오른쪽에 일정으로 추가하세요.</p>
            </div>
        </section>

        <!-- RIGHT PANEL: Timeline, Month Navigation & Deadline Management (7 cols) -->
        <section class="lg:col-span-7 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-indigo-600 rounded-full"></div>
                    <h2 class="font-bold text-slate-800 text-base">기간 설정 및 D-Day 타임라인</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openCustomAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition shadow-sm">
                        + 직접 일정 추가
                    </button>
                </div>
            </div>

            <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between bg-indigo-50/30">
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-1 bg-white border border-slate-200 rounded-xl p-1 shadow-xs">
                        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition" title="이전 달">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <span id="current-month-display" class="px-3 font-extrabold text-indigo-900 text-sm">2026년 9월</span>
                        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition" title="다음 달">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                    <button onclick="resetToCurrentMonth()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-white border border-indigo-200 px-2.5 py-2 rounded-xl shadow-xs transition">오늘 월</button>
                </div>
                <div class="flex space-x-1.5 text-xs">
                    <button onclick="filterTimeline('all')" id="timeline-filter-all" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition">전체</button>
                    <button onclick="filterTimeline('active')" id="timeline-filter-active" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition">진행중</button>
                    <button onclick="filterTimeline('completed')" id="timeline-filter-completed" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition">완료</button>
                </div>
            </div>

            <div class="px-5 py-2 border-b border-slate-100 flex items-center justify-between text-xs bg-white text-slate-500 font-medium">
                <span id="timeline-stats">선택 월 일정 0개</span>
                <span class="text-[11px] text-indigo-600 font-bold">💡 날짜와 마감기한(D-Day)을 크게 강조했습니다</span>
            </div>

            <div id="timeline-list" class="flex-1 overflow-y-auto p-4 space-y-4 max-h-[calc(100vh-330px)]">
                <!-- Dynamically populated timeline items -->
            </div>
        </section>

    </main>

    <!-- Modal: Setup Timeline Period for Inbox Item -->
    <div id="setup-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden transform transition-all">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg">이벤트 기간 설정 및 등록</h3>
                <button onclick="closeSetupModal()" class="text-slate-400 hover:text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="setup-form" onsubmit="submitSetupForm(event)" class="p-6 space-y-4">
                <input type="hidden" id="modal-inbox-id">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">이벤트명</label>
                    <input type="text" id="modal-title" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">시작일</label>
                        <input type="date" id="modal-start-date" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-indigo-900">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">마감일 (D-Day 기준)</label>
                        <input type="date" id="modal-end-date" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-rose-900">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">카테고리</label>
                    <select id="modal-category" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="축제">축제/행사</option>
                        <option value="시험">시험/평가</option>
                        <option value="동아리">동아리</option>
                        <option value="행정">학교행정</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">상세 내용 및 준비 사항</label>
                    <textarea id="modal-desc" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="준비물, 장소, 주의사항 등을 적어보세요..."></textarea>
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeSetupModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-sm transition">취소</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md shadow-indigo-200">타임라인에 추가</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Simulate Incoming Notification -->
    <div id="simulation-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full overflow-hidden transform transition-all">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-slate-800 text-base">알림 수신 시뮬레이션</h3>
                <button onclick="closeSimulationModal()" class="text-slate-400 hover:text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6 space-y-3">
                <p class="text-xs text-slate-500">학교 공지사항이나 알림톡으로 들어오는 가상의 이벤트를 선택해 즉시 수신함에 추가해보세요.</p>
                <div class="space-y-2">
                    <button onclick="simulateReceive('2학기 기말고사 안내', '시험', '전학년 대상 체육관 및 각 교실 시행', '2026-10-15', '2026-10-22')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-indigo-50/50 hover:border-indigo-300 transition text-xs">
                        <span class="font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded mr-2">시험</span> 2학기 기말고사 안내
                    </button>
                    <button onclick="simulateReceive('교내 동아리 발표대회 및 전시', '동아리', '본관 중앙 로비 및 시청각실', '2026-10-01', '2026-10-10')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-indigo-50/50 hover:border-indigo-300 transition text-xs">
                        <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded mr-2">동아리</span> 교내 동아리 발표대회
                    </button>
                    <button onclick="simulateReceive('대동제 축제 장기자랑 예선', '축제', '학생회실 및 음악실 접수', '2026-09-25', '2026-09-30')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-indigo-50/50 hover:border-indigo-300 transition text-xs">
                        <span class="font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded mr-2">축제</span> 대동제 축제 장기자랑 예선
                    </button>
                    <button onclick="simulateReceive('학생증 재발급 및 모바일 학생증 등록', '행정', '행정실 및 학생복지부', '2026-09-20', '2026-09-28')" class="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-indigo-50/50 hover:border-indigo-300 transition text-xs">
                        <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-2">행정</span> 학생증 재발급 및 모바일 등록
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initial Mock Data for Inbox and Timeline
        let inboxItems = [
            { id: 1, title: '2학기 중간고사 일정 안내', category: '시험', desc: '전 학년 대상 과목별 시험 범위 및 시간표 공지', dateDetected: '2026-09-15', defaultStart: '2026-10-05', defaultEnd: '2026-10-09', isProcessed: false },
            { id: 2, title: '한빛 예술제(학교 축제) 부스 신청', category: '축제', desc: '학급별 및 동아리별 체험 부스 기획서 제출', dateDetected: '2026-09-17', defaultStart: '2026-09-22', defaultEnd: '2026-09-30', isProcessed: false },
            { id: 3, title: '학교 도서관 독후감 대회', category: '행정', desc: '지정 도서 중 1권 읽고 독후감 제출 (상품 증정)', dateDetected: '2026-09-18', defaultStart: '2026-09-20', defaultEnd: '2026-10-10', isProcessed: false }
        ];

        let timelineItems = [
            { id: 101, title: '동아리 하반기 활동 보고서 작성', category: '동아리', startDate: '2026-09-10', endDate: '2026-09-25', desc: '실험 및 연구 내용 정리하여 동아리 담당 선생님께 제출', completed: false }
        ];

        let currentInboxFilter = 'all';
        let currentTimelineFilter = 'all';

        // Calendar Month Navigation State (Default to September 2026)
        let viewingYear = 2026;
        let viewingMonth = 8; // 0-indexed (8 = September)

        // Initialize App on Load
        window.onload = function() {
            renderInbox();
            renderTimeline();
        };

        // --- Month Navigation Functions ---
        function changeMonth(direction) {
            viewingMonth += direction;
            if (viewingMonth > 11) {
                viewingMonth = 0;
                viewingYear++;
            } else if (viewingMonth < 0) {
                viewingMonth = 11;
                viewingYear--;
            }
            renderTimeline();
        }

        function resetToCurrentMonth() {
            const now = new Date();
            viewingYear = now.getFullYear();
            viewingMonth = now.getMonth();
            renderTimeline();
        }

        // --- Inbox Functions ---
        function filterInbox(category) {
            currentInboxFilter = category;
            ['all', '축제', '시험', '동아리', '행정'].forEach(cat => {
                const btn = document.getElementById(`inbox-filter-${cat}`);
                if (btn) {
                    if (cat === category) {
                        btn.className = 'px-3 py-1.5 rounded-lg bg-slate-900 text-white font-medium transition whitespace-nowrap';
                    } else {
                        btn.className = 'px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition whitespace-nowrap';
                    }
                }
            });
            renderInbox();
        }

        function renderInbox() {
            const listContainer = document.getElementById('inbox-list');
            const countBadge = document.getElementById('inbox-count');
            
            const filtered = inboxItems.filter(item => {
                if (item.isProcessed) return false; // Hide processed items from inbox
                if (currentInboxFilter === 'all') return true;
                return item.category === currentInboxFilter;
            });

            countBadge.textContent = `${filtered.length}건 대기`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                        </svg>
                        <p class="text-sm font-medium text-slate-500">수신된 신규 알림이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">상단의 '새 알림 시뮬레이션'을 눌러 확인해보세요!</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = '';
            filtered.forEach(item => {
                const badgeColor = getCategoryColor(item.category);
                const el = document.createElement('div');
                el.className = 'bg-slate-50 hover:bg-indigo-50/40 border border-slate-200 rounded-xl p-4 transition shadow-xs flex flex-col justify-between space-y-2';
                el.innerHTML = `
                    <div class="flex items-start justify-between">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${badgeColor}">${item.category}</span>
                        <!-- 날짜가 가장 중요하므로 수신일 표시도 굵고 또렷하게 표시 -->
                        <span class="text-xs font-bold text-slate-600 bg-white px-2 py-0.5 rounded border border-slate-200">수신: ${item.dateDetected}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">${item.title}</h4>
                        <p class="text-xs text-slate-600 mt-1 line-clamp-2">${item.desc}</p>
                    </div>
                    <!-- 숨기기 버튼 제거 완료 -->
                    <div class="pt-2 flex justify-end border-t border-slate-200/60">
                        <button onclick="openSetupModalWithItem(${item.id})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm flex items-center justify-center space-x-1.5">
                            <span>기간 설정 및 등록</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        // --- Simulation Modal Functions ---
        function openSimulationModal() {
            document.getElementById('simulation-modal').classList.remove('hidden');
        }
        function closeSimulationModal() {
            document.getElementById('simulation-modal').classList.add('hidden');
        }
        function simulateReceive(title, category, desc, defaultStart, defaultEnd) {
            const newItem = {
                id: Date.now(),
                title: title,
                category: category,
                desc: desc,
                dateDetected: new Date().toISOString().split('T')[0],
                defaultStart: defaultStart,
                defaultEnd: defaultEnd,
                isProcessed: false
            };
            inboxItems.unshift(newItem);
            closeSimulationModal();
            renderInbox();
        }

        // --- Setup Modal & Timeline Registration ---
        function openSetupModalWithItem(id) {
            const item = inboxItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-inbox-id').value = item.id;
            document.getElementById('modal-title').value = item.title;
            document.getElementById('modal-start-date').value = item.defaultStart || new Date().toISOString().split('T')[0];
            document.getElementById('modal-end-date').value = item.defaultEnd || new Date().toISOString().split('T')[0];
            document.getElementById('modal-category').value = item.category;
            document.getElementById('modal-desc').value = item.desc;

            document.getElementById('setup-modal').classList.remove('hidden');
        }

        function openCustomAddModal() {
            document.getElementById('modal-inbox-id').value = '';
            document.getElementById('modal-title').value = '';
            document.getElementById('modal-start-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal-end-date').value = new Date(Date.now() + 7*86400000).toISOString().split('T')[0];
            document.getElementById('modal-category').value = '행정';
            document.getElementById('modal-desc').value = '';

            document.getElementById('setup-modal').classList.remove('hidden');
        }

        function closeSetupModal() {
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function submitSetupForm(event) {
            event.preventDefault();
            const inboxId = document.getElementById('modal-inbox-id').value;
            const title = document.getElementById('modal-title').value;
            const startDate = document.getElementById('modal-start-date').value;
            const endDate = document.getElementById('modal-end-date').value;
            const category = document.getElementById('modal-category').value;
            const desc = document.getElementById('modal-desc').value;

            if (startDate > endDate) {
                alert('시작일은 마감일보다 빠르거나 같아야 합니다.');
                return;
            }

            const newTimelineItem = {
                id: Date.now(),
                title,
                category,
                startDate,
                endDate,
                desc,
                completed: false
            };

            timelineItems.push(newTimelineItem);

            if (inboxId) {
                inboxItems = inboxItems.map(i => i.id == inboxId ? {...i, isProcessed: true} : i);
            }

            closeSetupModal();
            renderInbox();
            renderTimeline();
        }

        // --- Timeline & Deadline Functions ---
        function filterTimeline(filter) {
            currentTimelineFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`timeline-filter-${f}`);
                if (btn) {
                    if (f === filter) {
                        btn.className = 'px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition';
                    } else {
                        btn.className = 'px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition';
                    }
                }
            });
            renderTimeline();
        }

        function toggleCompleteTimeline(id) {
            timelineItems = timelineItems.map(item => item.id === id ? {...item, completed: !item.completed} : item);
            renderTimeline();
        }

        function deleteTimeline(id) {
            timelineItems = timelineItems.filter(item => item.id !== id);
            renderTimeline();
        }

        function calculateDday(endDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(endDateStr);
            target.setHours(0, 0, 0, 0);
            
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'D-DAY';
            if (diffDays > 0) return `D-${diffDays}`;
            return `D+${Math.abs(diffDays)}`;
        }

        function renderTimeline() {
            // Update Header Month Display
            document.getElementById('current-month-display').textContent = `${viewingYear}년 ${viewingMonth + 1}월`;

            const listContainer = document.getElementById('timeline-list');
            const stats = document.getElementById('timeline-stats');

            // Filter items that overlap with the currently viewed month/year or match filter tabs
            const filtered = timelineItems.filter(item => {
                // Check status filter
                if (currentTimelineFilter === 'active' && item.completed) return false;
                if (currentTimelineFilter === 'completed' && !item.completed) return false;

                // Check if the event's start or end month matches the viewing month/year
                const start = new Date(item.startDate);
                const end = new Date(item.endDate);
                
                const startMatch = start.getFullYear() === viewingYear && start.getMonth() === viewingMonth;
                const endMatch = end.getFullYear() === viewingYear && end.getMonth() === viewingMonth;
                
                // Also include if the current viewing month is between start and end
                const viewingDateObj = new Date(viewingYear, viewingMonth, 1);
                const viewingEndObj = new Date(viewingYear, viewingMonth + 1, 0);
                const spansMonth = start <= viewingEndObj && end >= viewingDateObj;

                return startMatch || endMatch || spansMonth;
            });

            stats.textContent = `${viewingYear}년 ${viewingMonth + 1}월 관련 일정 ${filtered.length}개`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="text-sm font-medium text-slate-500">${viewingYear}년 ${viewingMonth + 1}월에 등록된 일정이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">상단의 화살표를 눌러 다른 달을 확인하거나 좌측에서 일정을 등록해보세요.</p>
                    </div>
                `;
                return;
            }

            // Sort by end date (closest deadline first)
            filtered.sort((a, b) => new Date(a.endDate) - new Date(b.endDate));

            listContainer.innerHTML = '';
            filtered.forEach(item => {
                const badgeColor = getCategoryColor(item.category);
                const ddayText = calculateDday(item.endDate);
                const isUrgent = ddayText.startsWith('D-') && parseInt(ddayText.replace('D-', '')) <= 3;
                
                let ddayBadgeClass = 'bg-slate-100 text-slate-700 text-base px-3 py-1';
                if (item.completed) {
                    ddayBadgeClass = 'bg-emerald-100 text-emerald-800 text-sm px-2.5 py-1';
                } else if (ddayText === 'D-DAY' || isUrgent) {
                    ddayBadgeClass = 'bg-rose-600 text-white text-lg px-3.5 py-1.5 animate-pulse font-extrabold shadow-md';
                } else {
                    ddayBadgeClass = 'bg-indigo-100 text-indigo-900 text-base px-3 py-1 font-bold';
                }

                const el = document.createElement('div');
                el.className = `border rounded-2xl p-4 transition ${item.completed ? 'bg-slate-50 border-slate-200 opacity-75' : 'bg-white border-slate-200 shadow-xs hover:shadow-md'}`;
                
                el.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2.5">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${badgeColor}">${item.category}</span>
                            <!-- 날짜가 가장 중요하므로 D-Day 뱃지를 훨씬 크고 눈에 띄게 강조 -->
                            <span class="rounded-xl font-extrabold tracking-wide ${ddayBadgeClass}">${item.completed ? '완료됨' : ddayText}</span>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="toggleCompleteTimeline(${item.id})" class="text-xs px-3 py-1.5 rounded-xl border font-bold transition ${item.completed ? 'bg-slate-200 text-slate-700 border-slate-300' : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'}">
                                ${item.completed ? '다시 진행' : '완료하기'}
                            </button>
                            <button onclick="deleteTimeline(${item.id})" class="p-2 text-slate-400 hover:text-rose-600 rounded-xl transition" title="삭제">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="mt-3.5">
                        <h4 class="font-bold text-slate-900 text-base ${item.completed ? 'line-through text-slate-400' : ''}">${item.title}</h4>
                        <p class="text-xs text-slate-600 mt-1">${item.desc}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-1.5 font-bold text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200/80">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span>기간: ${item.startDate} ~ ${item.endDate}</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        function getCategoryColor(cat) {
            switch(cat) {
                case '축제': return 'bg-rose-100 text-rose-800';
                case '시험': return 'bg-amber-100 text-amber-800';
                case '동아리': return 'bg-emerald-100 text-emerald-800';
                case '행정': return 'bg-sky-100 text-sky-800';
                default: return 'bg-slate-100 text-slate-800';
            }
        }
    </script>

</body>
</html>
