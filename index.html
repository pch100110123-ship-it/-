<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>학교 교칙 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          head: ['Jua', 'Noto Sans KR', 'sans-serif'],
          body: ['Noto Sans KR', 'Apple SD Gothic Neo', 'sans-serif'],
        },
        colors: {
          brand: {
            50: '#f0f7ff',
            100: '#e0effe',
            500: '#2b8fd6',
            600: '#1d72b8',
            700: '#155893',
          }
        }
      }
    }
  }
</script>
<style>
  body {
    font-family: 'Noto Sans KR', sans-serif;
    word-break: keep-all;
    -webkit-tap-highlight-color: transparent;
  }
  mark {
    background: linear-gradient(transparent 55%, #ffe780 55%);
    color: inherit;
    padding: 0 2px;
  }
  .dark mark {
    background: linear-gradient(transparent 55%, #7a6516 55%);
  }
  .page-transition {
    animation: fadeIn 0.2s ease-in-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="bg-[#f5faff] dark:bg-[#0f1e2b] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 pb-10">

  <!-- Admin Mode Banner Indicator -->
  <div id="adminBanner" class="hidden bg-amber-500 text-slate-900 font-bold px-4 py-2 text-xs sm:text-sm text-center flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2 mx-auto">
      <span>⚙️ <strong>관리자 모드 활성화됨</strong> (규정 편집, 순서 변경, 삭제가 가능합니다)</span>
      <button id="adminExitBtn" class="bg-slate-900 text-white text-xs px-2.5 py-1 rounded-lg hover:bg-slate-800 ml-2">관리자 종료</button>
    </div>
  </div>

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-30 bg-[#f5faff]/90 dark:bg-[#0f1e2b]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <a href="#home" id="homeBtn" class="flex items-center gap-2 font-head text-lg text-brand-600 dark:text-brand-500 font-bold hover:opacity-80 transition-opacity">
        <span>🏫</span> <span>학교 교칙 정리</span>
      </a>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Bookmark Button -->
        <a href="#bookmarks" id="bookmarkPageBtn" class="hidden text-xs bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 px-2.5 py-1.5 rounded-xl font-medium flex items-center gap-1 border border-amber-200 dark:border-amber-800">
          ⭐ <span id="bookmarkCount">0</span>
        </a>

        <!-- Page counter -->
        <span id="pageCounter" class="text-xs font-semibold text-slate-500 dark:text-slate-400"></span>

        <!-- Admin Access Toggle -->
        <button id="adminAuthBtn" class="text-xs bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition-colors">
          ⚙️ <span id="adminBtnLabel">관리자</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggle" aria-label="테마 변경" class="p-1.5 rounded-xl bg-slate-200/60 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
    <!-- Progress Bar -->
    <div class="w-full bg-slate-200 dark:bg-slate-800 h-1">
      <div id="progressBar" class="bg-brand-500 h-1 w-0 transition-all duration-300"></div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6">

    <!-- HOME PAGE -->
    <section id="home" class="page-sec space-y-6">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold uppercase tracking-wider text-brand-600 dark:text-brand-500 bg-brand-50 dark:bg-brand-500/10 px-2 py-0.5 rounded-md">2026학년도</span>
            <span class="text-xs text-slate-500 dark:text-slate-400">학급 규정 가이드</span>
          </div>
          <h1 class="font-head text-3xl sm:text-4xl text-slate-900 dark:text-white">🏫 학교 교칙 정리</h1>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">🔍</span>
        <input type="text" id="searchInput" placeholder="검색어 입력 (예: 지각, 휴대폰, 복장...)" 
               class="w-full pl-10 pr-10 py-3 bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white placeholder-slate-400 transition-all">
        <button id="clearSearch" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">✕</button>
      </div>

      <!-- Filter Badges -->
      <div class="flex flex-wrap gap-2 text-xs font-medium">
        <button class="filter-btn active px-3 py-1.5 rounded-xl bg-brand-500 text-white font-semibold shadow-sm transition-all" data-filter="all">전체보기</button>
        <button class="filter-btn px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-brand-500 transition-all" data-filter="key">⭐ 필수규정</button>
        <button class="filter-btn px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-brand-500 transition-all" data-filter="new">🔥 개정항목</button>
      </div>

      <!-- Admin Actions Toolbar (Visible in Admin Mode) -->
      <div id="adminMenuToolbar" class="hidden bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="font-bold text-amber-900 dark:text-amber-200 text-sm">🛠️ 카테고리 & 데이터 관리</span>
          <button id="addCategoryBtn" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-colors flex items-center gap-1">
            ➕ 카테고리 추가
          </button>
        </div>
        <div class="flex flex-wrap gap-2 pt-2 border-t border-amber-200 dark:border-amber-800/60 text-xs">
          <button id="exportJsonBtn" class="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 px-2.5 py-1 rounded-lg font-medium hover:bg-slate-100">📥 JSON 백업 다운로드</button>
          <label class="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 px-2.5 py-1 rounded-lg font-medium hover:bg-slate-100 cursor-pointer">
            📤 JSON 불러오기
            <input type="file" id="importJsonInput" accept=".json" class="hidden">
          </label>
          <button id="resetDefaultBtn" class="bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-900 px-2.5 py-1 rounded-lg font-medium hover:bg-rose-200 ml-auto">🔄 기본값 초기화</button>
        </div>
      </div>

      <!-- Menu Dynamic Grid -->
      <div id="menuContainer" class="grid gap-3">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- BOOKMARKS PAGE -->
    <section id="bookmarks" class="page-sec hidden space-y-6">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <div>
          <h1 class="font-head text-2xl sm:text-3xl flex items-center gap-2">⭐ 즐겨찾기한 규정</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">자주 찾아보는 항목입니다.</p>
        </div>
        <a href="#home" class="text-xs bg-slate-200 dark:bg-slate-800 px-3 py-1.5 rounded-xl font-medium">목차로</a>
      </div>
      <div id="bookmarkContainer" class="grid gap-3"></div>
    </section>

    <!-- DYNAMIC DETAIL VIEW SECTION -->
    <section id="detailView" class="page-sec hidden space-y-5 relative">
      <!-- Floating Side Navigation Arrows -->
      <button id="sidePrevBtn" aria-label="이전 규정" class="fixed left-2 sm:left-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 shadow-lg text-slate-700 dark:text-slate-200 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 font-bold text-xl sm:text-2xl flex items-center justify-center transition-all backdrop-blur-sm">
        ‹
      </button>
      <button id="sideNextBtn" aria-label="다음 규정" class="fixed right-2 sm:right-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 shadow-lg text-slate-700 dark:text-slate-200 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 font-bold text-xl sm:text-2xl flex items-center justify-center transition-all backdrop-blur-sm">
        ›
      </button>

      <!-- Dynamic rendering via JavaScript -->
      <div id="detailContent" class="space-y-5"></div>
    </section>

    <!-- Bottom Navigation Bar for Detail View -->
    <nav id="pagerNav" class="hidden mt-8 pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-center">
      <a href="#home" class="py-2.5 px-6 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold text-xs sm:text-sm transition-colors flex items-center gap-1 shadow-sm">
        🏫 목차로 돌아가기
      </a>
    </nav>

  </main>

  <!-- MODALS -->

  <!-- Admin Auth Modal -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="text-center">
        <span class="text-4xl">🔒</span>
        <h3 class="font-head text-xl mt-2 text-slate-900 dark:text-white">관리자 인증</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">비밀번호를 입력하세요 (기본: 1234)</p>
      </div>
      <input type="password" id="adminPinInput" placeholder="비밀번호" class="w-full text-center text-lg tracking-widest px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
      <div class="flex gap-2">
        <button id="authCancelBtn" class="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-600 dark:text-slate-300">취소</button>
        <button id="authSubmitBtn" class="flex-1 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-sm">확인</button>
      </div>
    </div>
  </div>

  <!-- Category Edit Modal -->
  <div id="categoryModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <h3 id="catModalTitle" class="font-head text-xl text-slate-900 dark:text-white">카테고리 수정</h3>
      
      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">아이콘 (이모지)</label>
          <input type="text" id="catIconInput" placeholder="⏰" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white">
        </div>
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">카테고리 제목</label>
          <input type="text" id="catNameInput" placeholder="예: 출결 규정" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white">
        </div>
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">부제목 / 설명</label>
          <input type="text" id="catSubInput" placeholder="규정에 대한 간단한 설명" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white">
        </div>
        <div class="flex items-center gap-4 pt-2">
          <label class="flex items-center gap-1.5 cursor-pointer font-bold">
            <input type="checkbox" id="catKeyCheck" class="rounded text-brand-500 w-4 h-4">
            <span>⭐ 필수 항목 지정</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer font-bold">
            <input type="checkbox" id="catNewCheck" class="rounded text-rose-500 w-4 h-4">
            <span>🔥 NEW 배지 표시</span>
          </label>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="catModalCancel" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-600 dark:text-slate-300">취소</button>
        <button id="catModalSave" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold">저장</button>
      </div>
    </div>
  </div>

  <!-- Item Edit Modal -->
  <div id="itemModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4 max-h-[90vh] overflow-y-auto">
      <h3 id="itemModalTitle" class="font-head text-xl text-slate-900 dark:text-white">규정 세부 항목 수정</h3>
      
      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">태그 구분</label>
          <select id="itemTagType" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white">
            <option value="OK">OK (허용/권장 - 초록)</option>
            <option value="NO">NO (금지/주의 - 빨강)</option>
            <option value="NEW">NEW (개정 - 분홍)</option>
            <option value="WARN">WARN (주의/기준 - 주황)</option>
            <option value="INFO">INFO (안내/참고 - 파랑)</option>
            <option value="NONE">태그 없음</option>
          </select>
        </div>
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">태그 커스텀 텍스트 (선택)</label>
          <input type="text" id="itemTagText" placeholder="비워두면 태그타입이 기본 적용됩니다" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white">
        </div>
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">제목 / 메인 문구</label>
          <input type="text" id="itemTitleInput" placeholder="예: 지각 기준" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white">
        </div>
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">상세 설명 내용</label>
          <textarea id="itemDescInput" rows="4" placeholder="상세 규정 설명" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white resize-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="itemModalCancel" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-600 dark:text-slate-300">취소</button>
        <button id="itemModalSave" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold">저장</button>
      </div>
    </div>
  </div>

  <!-- Custom Alert/Confirm Modal -->
  <div id="confirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4 text-center">
      <div id="confirmIcon" class="text-4xl">⚠️</div>
      <p id="confirmMessage" class="text-sm font-bold text-slate-800 dark:text-slate-200"></p>
      <div class="flex gap-2">
        <button id="confirmCancelBtn" class="flex-1 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-600 dark:text-slate-300">취소</button>
        <button id="confirmOkBtn" class="flex-1 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">확인</button>
      </div>
    </div>
  </div>

<script>
// Default Pre-populated Class Rules Data Structure
const DEFAULT_RULES = [
  {
    id: "attend",
    ic: "⏰",
    nm: "출결",
    sub: "지각, 조퇴, 결과 출결 규정",
    key: true,
    isNew: false,
    items: [
      { id: "att-1", tag: "WARN", tagText: "기준", title: "지각 (Lateness)", desc: "<mark>8시 30분까지 교실에 앉지 못하면 지각</mark>이에요. (학년부 단위로 일관되게 지도해요)" },
      { id: "att-2", tag: "INFO", tagText: "안내", title: "조퇴 (Early Leave)", desc: "정규 종례 시간 전에 학교장의 허락을 받고 하교하는 것입니다." },
      { id: "att-3", tag: "NO", tagText: "주의", title: "결과 (Class Absence)", desc: "수업(50분) 전부 또는 일부(15분 내외) 불참 행위입니다. 쌓이면 교과 미이수 및 졸업 차질이 생길 수 있어요." }
    ]
  },
  {
    id: "dress",
    ic: "👕",
    nm: "복장 · 신발",
    sub: "단정하고 품격 있는 학교 생활 차림",
    key: true,
    isNew: false,
    items: [
      { id: "dr-1", tag: "OK", title: "지정 복장 착용", desc: "교복, 생활복, 체육복 상·하의 중 하나 이상을 입습니다." },
      { id: "dr-2", tag: "NO", title: "불쾌감 유발 복장", desc: "타인에게 과도한 불쾌감을 주는 복장은 지도받을 수 있어요." },
      { id: "dr-3", tag: "NO", title: "슬리퍼·크록스 등교", desc: "등하교 시 슬리퍼/크록스 착용 금지 (운동화 등 안전한 신발 착용)." },
      { id: "dr-4", tag: "OK", title: "실내화 착용", desc: "교실과 급식소 등 실내 건물에서는 실내화를 신습니다." }
    ]
  },
  {
    id: "phone",
    ic: "📱",
    nm: "스마트기기",
    sub: "스마트폰, 태블릿, 무선 이어폰 등",
    key: true,
    isNew: true,
    items: [

// LocalStorage Handlers
function loadData() {
  const saved = localStorage.getItem('class_rules_data');
  if (saved) {
    try { rulesData = JSON.parse(saved); } catch(e) { rulesData = DEFAULT_RULES; }
  } else {
    rulesData = DEFAULT_RULES;
  }
  
  const savedBookmarks = localStorage.getItem('class_rules_bookmarks');
  if (savedBookmarks) {
    try { bookmarks = JSON.parse(savedBookmarks); } catch(e) { bookmarks = []; }
  }
}

function saveData() {
  localStorage.setItem('class_rules_data', JSON.stringify(rulesData));
}

function saveBookmarks() {
  localStorage.setItem('class_rules_bookmarks', JSON.stringify(bookmarks));
  updateBookmarkUI();
}

// Theme Handlers

function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
    themeIcon.textContent = '☀️';
  } else {
    document.documentElement.classList.remove('dark');
    themeIcon.textContent = '🌙';
  }
}

  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeIcon.textContent = isDark ? '☀️' : '🌙';
});

// Render Helper for Tags
function renderTag(tag, customText) {
  if (tag === 'NONE') return '';
  let colorClass = 'bg-slate-500 text-white';
  let label = customText || tag;

  switch(tag) {
    case 'OK':
      colorClass = 'bg-emerald-500 text-white';
      label = customText || 'OK';
      break;
    case 'NO':
      colorClass = 'bg-rose-500 text-white';
      label = customText || 'NO';
      break;
    case 'NEW':
      colorClass = 'bg-pink-500 text-white';
      label = customText || 'NEW';
      break;
    case 'WARN':
      colorClass = 'bg-amber-500 text-white';
      label = customText || '주의';
      break;
    case 'INFO':
      colorClass = 'bg-brand-500 text-white';
      label = customText || '안내';
      break;
  }

  return `<span class="${colorClass} text-xs font-head px-2.5 py-0.5 rounded-full shrink-0">${label}</span>`;
}

// Build Main Directory Menu Cards
function buildMenu() {
  menuContainer.innerHTML = '';

  rulesData.forEach((cat, idx) => {
    const card = document.createElement('div');
    card.className = `rule-card bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 hover:border-brand-500 dark:hover:border-brand-500 rounded-2xl p-4 flex flex-col gap-2 shadow-sm transition-all duration-200`;
    card.dataset.id = cat.id;
    card.dataset.nm = cat.nm;
    card.dataset.key = cat.key ? '1' : '0';
    card.dataset.new = cat.isNew ? '1' : '0';

    let badges = '';
    if (cat.key) badges += `<span class="bg-brand-500 text-white text-[11px] font-head px-2 py-0.5 rounded-full">필수</span>`;
    if (cat.isNew) badges += `<span class="bg-rose-500 text-white text-[11px] font-head px-2 py-0.5 rounded-full">NEW</span>`;

    let adminControls = '';
    if (isAdmin) {
      adminControls = `
        <div class="flex items-center gap-1 border-t border-slate-100 dark:border-slate-700/60 pt-2 mt-1 text-xs">
          <button onclick="moveCat(${idx}, -1)" class="p-1 text-slate-500 hover:text-slate-800 dark:hover:text-white" title="위로">▲</button>
          <button onclick="moveCat(${idx}, 1)" class="p-1 text-slate-500 hover:text-slate-800 dark:hover:text-white" title="아래로">▼</button>
          <button onclick="openCategoryModal('${cat.id}')" class="ml-auto px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded text-slate-700 dark:text-slate-200 font-bold">✏️ 카테고리 수정</button>
          <button onclick="deleteCategory('${cat.id}')" class="px-2 py-1 bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300 rounded font-bold">🗑️ 삭제</button>
        </div>
      `;
    }

    card.innerHTML = `
      <a href="#${cat.id}" class="flex items-center justify-between gap-3 w-full">
        <div class="flex items-center gap-3">
          <span class="text-2xl sm:text-3xl">${cat.ic}</span>
          <div>
            <span class="font-bold text-slate-800 dark:text-slate-100 text-base sm:text-lg block">${cat.nm}</span>
            <span class="text-xs text-slate-500 dark:text-slate-400 font-normal">${cat.sub || ''}</span>
          </div>
        </div>

          ${badges}
          <span class="text-slate-400 font-bold text-lg">›</span>
        </div>
      </a>
      ${adminControls}
    `;

    menuContainer.appendChild(card);
  });

  filterMenu();
}

// Search and Filter Menu Cards
function filterMenu() {
  const query = searchInput.value.trim().toLowerCase();
  const activeFilterBtn = document.querySelector('.filter-btn.active');
  const filterType = activeFilterBtn ? activeFilterBtn.dataset.filter : 'all';

  const cards = menuContainer.querySelectorAll('.rule-card');

  cards.forEach(card => {
    const catId = card.dataset.id;
    const cat = rulesData.find(r => r.id === catId);
    if (!cat) return;

    const matchesName = cat.nm.toLowerCase().includes(query) || (cat.sub && cat.sub.toLowerCase().includes(query));
    const matchesItems = cat.items.some(item => 
      item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query)
    );

    const matchesSearch = !query || matchesName || matchesItems;
    
    let matchesCategory = true;
    if (filterType === 'key') matchesCategory = cat.key;
    if (filterType === 'new') matchesCategory = cat.isNew;

    if (matchesSearch && matchesCategory) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });

  clearSearch.classList.toggle('hidden', !query);
}

searchInput.addEventListener('input', filterMenu);
clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  filterMenu();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => {
      b.classList.remove('active', 'bg-brand-500', 'text-white', 'font-semibold');
      b.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
    });
    btn.classList.add('active', 'bg-brand-500', 'text-white', 'font-semibold');
    btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
    filterMenu();
  });
});

// Category Reorder & Delete
window.moveCat = function(idx, dir) {
  const targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= rulesData.length) return;
  const temp = rulesData[idx];
  rulesData[idx] = rulesData[targetIdx];
  rulesData[targetIdx] = temp;
  saveData();
  buildMenu();
};

window.deleteCategory = function(catId) {
  showConfirm('이 카테고리 및 연관된 모든 규정 항목을 삭제하시겠습니까?', () => {
    rulesData = rulesData.filter(c => c.id !== catId);
    bookmarks = bookmarks.filter(b => b !== catId);
    saveData();
    saveBookmarks();
    buildMenu();
    if (location.hash.slice(1) === catId) location.hash = 'home';
  });
};

// Category Modal CRUD
document.getElementById('addCategoryBtn').onclick = () => openCategoryModal(null);

function openCategoryModal(catId) {
  currentEditingCatId = catId;
  if (catId) {
    const cat = rulesData.find(c => c.id === catId);
    catModalTitle.textContent = '카테고리 수정';
    catIconInput.value = cat.ic;
    catNameInput.value = cat.nm;
    catSubInput.value = cat.sub || '';
    catKeyCheck.checked = !!cat.key;
    catNewCheck.checked = !!cat.isNew;
  } else {
    catModalTitle.textContent = '새 카테고리 추가';
    catIconInput.value = '📌';
    catNameInput.value = '';
    catSubInput.value = '';
    catKeyCheck.checked = false;
    catNewCheck.checked = false;
  }
  categoryModal.classList.remove('hidden');
}

catModalCancel.onclick = () => categoryModal.classList.add('hidden');

catModalSave.onclick = () => {
  const nm = catNameInput.value.trim();
  if (!nm) {
    showConfirm('카테고리 제목을 입력해주세요.', null);
    return;
  }

  if (currentEditingCatId) {
    const cat = rulesData.find(c => c.id === currentEditingCatId);
    cat.ic = catIconInput.value.trim() || '📌';
    cat.nm = nm;
    cat.sub = catSubInput.value.trim();
    cat.key = catKeyCheck.checked;
    cat.isNew = catNewCheck.checked;
  } else {
    const newId = 'cat-' + Date.now();
    rulesData.push({
      id: newId,
      ic: catIconInput.value.trim() || '📌',
      nm: nm,
      sub: catSubInput.value.trim(),
      key: catKeyCheck.checked,
      isNew: catNewCheck.checked,
      items: []
    });
  }

  saveData();
  categoryModal.classList.add('hidden');
  buildMenu();
  if (currentEditingCatId) renderDetailView(currentEditingCatId);
};

// Item Modal CRUD
window.openItemModal = function(catId, itemId = null) {
  currentEditingCatId = catId;
  currentEditingItemId = itemId;

  if (itemId) {
    const cat = rulesData.find(c => c.id === catId);
    const item = cat.items.find(i => i.id === itemId);
    itemModalTitle.textContent = '규정 항목 수정';
    itemTagType.value = item.tag || 'INFO';
    itemTagText.value = item.tagText || '';
    itemTitleInput.value = item.title || '';
    itemDescInput.value = (item.desc || '').replace(/<mark>/g, '').replace(/<\/mark>/g, '');
  } else {
    itemModalTitle.textContent = '새 규정 항목 추가';
    itemTagType.value = 'OK';
    itemTagText.value = '';
    itemTitleInput.value = '';
    itemDescInput.value = '';
  }

  itemModal.classList.remove('hidden');
};

    const item = cat.items.find(i => i.id === currentEditingItemId);
    item.tag = itemTagType.value;
    item.tagText = itemTagText.value.trim();
    item.title = title;
    item.desc = desc;
  } else {
    cat.items.push({
      id: 'item-' + Date.now(),
      tag: itemTagType.value,
      tagText: itemTagText.value.trim(),
      title: title,
      desc: desc
    });
  }

  saveData();
  itemModal.classList.add('hidden');
  renderDetailView(currentEditingCatId);
};

window.moveItem = function(catId, itemIdx, dir) {
  const cat = rulesData.find(c => c.id === catId);
  if (!cat) return;
  const targetIdx = itemIdx + dir;
  if (targetIdx < 0 || targetIdx >= cat.items.length) return;
  
  const temp = cat.items[itemIdx];
  cat.items[itemIdx] = cat.items[targetIdx];
  cat.items[targetIdx] = temp;
  
  saveData();
  renderDetailView(catId);
};

window.deleteItem = function(catId, itemId) {
  showConfirm('이 규정 항목을 삭제하시겠습니까?', () => {
    const cat = rulesData.find(c => c.id === catId);
    if (cat) {
      cat.items = cat.items.filter(i => i.id !== itemId);
      saveData();
      renderDetailView(catId);
    }
  });
};

// JSON Backup / Export / Import / Reset
document.getElementById('exportJsonBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(rulesData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `학급규정_백업_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importJsonInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const data = JSON.parse(event.target.result);
      if (Array.isArray(data)) {
        rulesData = data;
        saveData();
        buildMenu();
        showConfirm('성공적으로 데이터가 불러와졌습니다.', null);
      } else {
        showConfirm('올바르지 않은 JSON 파일 형식입니다.', null);
      }
    } catch (err) {
      showConfirm('JSON 파일 해석 실패.', null);
    }
  };
  reader.readAsText(file);
};

document.getElementById('resetDefaultBtn').onclick = () => {
  showConfirm('모든 카테고리와 규정을 초기 기본값으로 되돌리시겠습니까?', () => {
    rulesData = DEFAULT_RULES;
    saveData();
    buildMenu();
    navigate();
  });
};

// Bookmarks Handling
function updateBookmarkUI() {
  bookmarkCountEl.textContent = bookmarks.length;
  bookmarkPageBtn.classList.toggle('hidden', bookmarks.length === 0);

  bookmarkContainer.innerHTML = '';
  if (bookmarks.length === 0) {
    bookmarkContainer.innerHTML = `
      <div class="text-center py-10 text-slate-400">
        <p class="text-3xl mb-2">⭐</p>
        <p class="text-sm">즐겨찾기한 규정이 없습니다.<br>각 규정 페이지의 별표(☆) 버튼을 눌러 추가해보세요.</p>
      </div>
    `;
  } else {
    bookmarks.forEach(id => {
      const cat = rulesData.find(r => r.id === id);
      if (!cat) return;

      const card = document.createElement('a');
      card.href = `#${cat.id}`;
      card.className = `bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 flex items-center justify-between shadow-sm`;
      card.innerHTML = `
        <div class="flex items-center gap-3">
          <span class="text-2xl">${cat.ic}</span>
          <span class="font-bold text-slate-800 dark:text-slate-100 text-sm sm:text-base">${cat.nm}</span>
        </div>
        <span class="text-brand-500 font-bold text-sm">바로가기 ›</span>
      `;
      bookmarkContainer.appendChild(card);
    });
  }
}

// Render Detail Category Page
function renderDetailView(catId) {
  const cat = rulesData.find(r => r.id === catId);
  if (!cat) return;

  const isBookmarked = bookmarks.includes(catId);

  // Essential Rule Notice Banner
  let essentialBanner = '';
  if (cat.key) {
    essentialBanner = `
      <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/80 rounded-2xl p-3.5 flex items-start gap-3 shadow-sm">
        <span class="text-xl shrink-0">⚠️</span>
        <p class="text-xs sm:text-sm font-semibold text-amber-900 dark:text-amber-200 leading-relaxed">
          학생들이 학교생활을 하면서 많이 놓치는 교칙입니다. 꼭 지켜주세요.
        </p>
      </div>
    `;
  }

  let itemsHtml = '';
  cat.items.forEach((item, itemIdx) => {
    let itemAdminControls = '';
    if (isAdmin) {
      itemAdminControls = `
        <div class="flex items-center gap-1 border-t border-slate-100 dark:border-slate-700/60 pt-2 mt-2 text-xs">
          <button onclick="moveItem('${cat.id}', ${itemIdx}, -1)" class="p-1 text-slate-500 hover:text-slate-800 dark:hover:text-white" title="위로">▲</button>
          <button onclick="moveItem('${cat.id}', ${itemIdx}, 1)" class="p-1 text-slate-500 hover:text-slate-800 dark:hover:text-white" title="아래로">▼</button>
          <button onclick="openItemModal('${cat.id}', '${item.id}')" class="ml-auto px-2 py-0.5 bg-slate-100 dark:bg-slate-700 rounded text-slate-700 dark:text-slate-200 font-bold">✏️ 수정</button>
          <button onclick="deleteItem('${cat.id}', '${item.id}')" class="px-2 py-0.5 bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300 rounded font-bold">🗑️ 삭제</button>
        </div>
      `;
    }

    itemsHtml += `
      <div class="bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 rounded-2xl p-4 shadow-sm space-y-1">
        <div class="flex items-start gap-2.5">
          ${renderTag(item.tag, item.tagText)}
          <div>
            <h3 class="font-bold text-slate-900 dark:text-slate-100 text-sm sm:text-base">${item.title}</h3>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed mt-1">${item.desc}</p>
          </div>
        </div>
        ${itemAdminControls}
      </div>
    `;
  });

  if (cat.items.length === 0) {
    itemsHtml = `<div class="text-center py-8 text-slate-400 text-sm">등록된 세부 규정이 없습니다.</div>`;
  }

  let adminCatHeaderBtn = '';
  if (isAdmin) {
    adminCatHeaderBtn = `
      <div class="flex items-center gap-2 mt-2">
        <button onclick="openItemModal('${cat.id}')" class="bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1">
          ➕ 세부 규정 항목 추가
        </button>
        <button onclick="openCategoryModal('${cat.id}')" class="bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 text-xs font-bold px-3 py-1.5 rounded-xl">
          ✏️ 카테고리 정보 수정
        </button>
      </div>
    `;
  }

  detailContent.innerHTML = `
    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
      <div class="flex items-center gap-3">
        <span class="text-4xl">${cat.ic}</span>
        <div>
          <h1 class="font-head text-2xl sm:text-3xl text-slate-900 dark:text-white">${cat.nm}</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">${cat.sub || ''}</p>
        </div>
      </div>
      <button id="bmToggleBtn" class="p-2.5 rounded-2xl border ${isBookmarked ? 'border-amber-400 text-amber-500 bg-amber-50 dark:bg-amber-950/30' : 'border-slate-200 dark:border-slate-700 text-slate-400'} text-xl transition-all" title="즐겨찾기">
        ${isBookmarked ? '⭐' : '☆'}
      </button>
    </div>

    ${adminCatHeaderBtn}

    ${essentialBanner}

    <div class="space-y-3 pt-1">
      ${itemsHtml}
    </div>
  `;

  document.getElementById('bmToggleBtn').onclick = () => {
    if (bookmarks.includes(catId)) {
      bookmarks = bookmarks.filter(b => b !== catId);
    } else {
      bookmarks.push(catId);
    }
    saveBookmarks();
    renderDetailView(catId);
  };
}

// Router & Page Switcher
function navigate() {
  const hash = location.hash.slice(1) || 'home';
  const pageSecs = Array.from(document.querySelectorAll('.page-sec'));
  const catIds = rulesData.map(r => r.id);
  const activeIdx = catIds.indexOf(hash);

  pageSecs.forEach(sec => {
    if (sec.id === hash || (hash !== 'home' && hash !== 'bookmarks' && sec.id === 'detailView')) {
      sec.classList.remove('hidden');
      sec.classList.add('page-transition');
    } else {
      sec.classList.add('hidden');
      sec.classList.remove('page-transition');
    }
  });

  if (hash === 'home' || hash === 'bookmarks') {
    pagerNav.classList.add('hidden');
    pageCounter.textContent = '';
    progressBar.style.width = '0%';
  } else {
    renderDetailView(hash);
    pagerNav.classList.remove('hidden');

    if (activeIdx !== -1) {
      pageCounter.textContent = `${activeIdx + 1} / ${catIds.length}`;
      progressBar.style.width = `${((activeIdx + 1) / catIds.length) * 100}%`;

      const goPrev = () => {
        if (activeIdx > 0) location.hash = catIds[activeIdx - 1];
        else location.hash = 'home';
      };

      const goNext = () => {
        if (activeIdx < catIds.length - 1) location.hash = catIds[activeIdx + 1];
        else location.hash = 'home';
      };

      sidePrevBtn.onclick = goPrev;
      sideNextBtn.onclick = goNext;
    }
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Keyboard Navigation Support
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const currentHash = location.hash.slice(1);
  const catIds = rulesData.map(r => r.id);
  const i = catIds.indexOf(currentHash);

  if (i !== -1) {
    if (e.key === 'ArrowRight' && i < catIds.length - 1) {
      location.hash = catIds[i + 1];
    } else if (e.key === 'ArrowLeft') {
      if (i > 0) location.hash = catIds[i - 1];
      else location.hash = 'home';
    }
  }
});

// Initialization
loadData();
buildMenu();
updateBookmarkUI();
window.addEventListener('hashchange', navigate);
navigate();
</script>
