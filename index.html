<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교알리미 - 고등학교 일정 & D-Day 허브</title>
    <!-- Tailwind CSS with modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard font -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        /* Custom smooth scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
        
        .light-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .light-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(79, 70, 229, 0.15);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">

    <!-- HEADER (Pure White Theme, No Simulation/Theme toggle buttons) -->
    <header class="light-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between py-3">
            <div class="flex items-center space-x-3.5">
                <div class="relative">
                    <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-violet-500 rounded-2xl blur opacity-30"></div>
                    <div class="relative bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-black tracking-tight text-slate-900">학교알리미</h1>
                        <span class="bg-indigo-100 text-indigo-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-indigo-200">v3.0 CLEAN</span>
                    </div>
                    <p class="text-xs text-slate-500 font-medium mt-0.5">고등학생을 위한 스마트 알림 & D-Day 캘린더 허브</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-2 rounded-xl border border-slate-200">
                    📅 2026년 9월 18일 기준
                </span>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT PANEL: Notification Inbox (5 cols) -->
        <section class="lg:col-span-5 flex flex-col light-card rounded-3xl overflow-hidden shadow-sm">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-white">
                <div class="flex items-center space-x-2.5">
                    <div class="w-3 h-3 bg-amber-500 rounded-full animate-pulse"></div>
                    <h2 class="font-bold text-slate-900 text-sm tracking-wide">수신된 알림 & 이벤트 피드</h2>
                </div>
                <span id="inbox-count" class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-200">0건 대기</span>
            </div>

            <!-- Filter tabs for inbox -->
            <div class="px-5 py-3 border-b border-slate-100 flex space-x-2 overflow-x-auto text-xs bg-slate-50/50">
                <button onclick="filterInbox('all')" id="inbox-filter-all" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white font-bold transition whitespace-nowrap shadow-sm">전체</button>
                <button onclick="filterInbox('축제')" id="inbox-filter-축제" class="px-3.5 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100 font-medium transition whitespace-nowrap border border-slate-200">축제/행사</button>
                <button onclick="filterInbox('시험')" id="inbox-filter-시험" class="px-3.5 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100 font-medium transition whitespace-nowrap border border-slate-200">시험/평가</button>
                <button onclick="filterInbox('동아리')" id="inbox-filter-동아리" class="px-3.5 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100 font-medium transition whitespace-nowrap border border-slate-200">동아리</button>
                <button onclick="filterInbox('행정')" id="inbox-filter-행정" class="px-3.5 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100 font-medium transition whitespace-nowrap border border-slate-200">학교행정</button>
            </div>

            <!-- Inbox list container -->
            <div id="inbox-list" class="flex-1 overflow-y-auto p-4 space-y-3.5 max-h-[calc(100vh-290px)]">
                <!-- Dynamically populated inbox items -->
            </div>
            
            <div class="p-3.5 bg-slate-50 border-t border-slate-100 text-center">
                <p class="text-[11px] text-slate-500 font-medium">✨ 알림 내용을 확인하고 "기간 설정 및 등록"을 눌러 타임라인에 추가하세요.</p>
            </div>
        </section>

        <!-- RIGHT PANEL: Timeline with Yearly/Monthly/Weekly Mode Selector (7 cols) -->
        <section class="lg:col-span-7 flex flex-col light-card rounded-3xl overflow-hidden shadow-sm">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-white">
                <div class="flex items-center space-x-2.5">
                    <div class="w-3 h-3 bg-indigo-600 rounded-full"></div>
                    <h2 class="font-bold text-slate-900 text-sm tracking-wide">기간 설정 및 D-Day 타임라인</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openCustomAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-sm">
                        + 직접 일정 추가
                    </button>
                </div>
            </div>

            <!-- Timeline Mode Selector Bar (Yearly, Monthly, Weekly) -->
            <div class="px-5 py-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3 bg-slate-50/70">
                <!-- View Mode Tabs -->
                <div class="flex space-x-1 bg-slate-200/70 p-1 rounded-2xl">
                    <button onclick="setTimelineView('yearly')" id="view-mode-yearly" class="px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-600 transition">연간 (Year)</button>
                    <button onclick="setTimelineView('monthly')" id="view-mode-monthly" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-indigo-600 shadow-sm transition">월간 (Month)</button>
                    <button onclick="setTimelineView('weekly')" id="view-mode-weekly" class="px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-600 transition">주간 (Week)</button>
                </div>

                <!-- Date Navigation Controls -->
                <div class="flex items-center space-x-2">
                    <div class="flex items-center space-x-1 bg-white border border-slate-200 rounded-2xl p-1 shadow-sm">
                        <button onclick="navigateTime(-1)" class="p-1.5 hover:bg-slate-100 rounded-xl text-slate-600 transition" title="이전">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <span id="timeline-range-display" class="px-3 font-extrabold text-indigo-600 text-xs tracking-wide">2026년 9월</span>
                        <button onclick="navigateTime(1)" class="p-1.5 hover:bg-slate-100 rounded-xl text-slate-600 transition" title="다음">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                    <button onclick="resetToCurrentDate()" class="text-xs font-bold text-slate-700 hover:bg-slate-100 bg-white border border-slate-200 px-3 py-2 rounded-xl transition shadow-sm">오늘</button>
                </div>
            </div>

            <!-- Sub-filter (All / Active / Completed) -->
            <div class="px-5 py-2.5 border-b border-slate-100 flex items-center justify-between text-xs bg-white text-slate-500 font-medium">
                <span id="timeline-stats">해당 기간 일정 0개</span>
                <div class="flex space-x-1.5 text-xs">
                    <button onclick="filterTimeline('all')" id="timeline-filter-all" class="px-3 py-1 rounded-lg bg-indigo-600 text-white font-bold transition shadow-sm">전체</button>
                    <button onclick="filterTimeline('active')" id="timeline-filter-active" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition">진행중</button>
                    <button onclick="filterTimeline('completed')" id="timeline-filter-completed" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition">완료</button>
                </div>
            </div>

            <!-- Timeline List Container -->
            <div id="timeline-list" class="flex-1 overflow-y-auto p-4 space-y-4 max-h-[calc(100vh-340px)] bg-slate-50/30">
                <!-- Dynamically populated timeline items -->
            </div>
        </section>

    </main>

    <!-- Modal: Setup Timeline Period for Inbox Item / Custom Add -->
    <div id="setup-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all glow-effect">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-white">
                <h3 class="font-black text-slate-900 text-base">이벤트 기간 설정 및 등록</h3>
                <button onclick="closeSetupModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl bg-slate-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="setup-form" onsubmit="submitSetupForm(event)" class="p-6 space-y-4 text-xs">
                <input type="hidden" id="modal-inbox-id">
                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">이벤트명</label>
                    <input type="text" id="modal-title" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-indigo-700 mb-1.5">시작일 (D-Day 기준)</label>
                        <input type="date" id="modal-start-date" required class="w-full px-3.5 py-2.5 bg-indigo-50/50 border border-indigo-200 rounded-2xl text-indigo-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                    </div>
                    <div>
                        <label class="block font-bold text-rose-700 mb-1.5">마감일</label>
                        <input type="date" id="modal-end-date" required class="w-full px-3.5 py-2.5 bg-rose-50/50 border border-rose-200 rounded-2xl text-rose-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">카테고리</label>
                    <select id="modal-category" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                        <option value="축제">축제/행사</option>
                        <option value="시험">시험/평가</option>
                        <option value="동아리">동아리</option>
                        <option value="행정">학교행정</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1.5">상세 내용 및 준비 사항</label>
                    <textarea id="modal-desc" rows="3" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="준비물, 장소, 주의사항 등을 적어보세요..."></textarea>
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeSetupModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-2xl transition">취소</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition shadow-md shadow-indigo-200">타임라인에 추가</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // Initial Mock Data
        let inboxItems = [
            { id: 1, title: '2학기 중간고사 일정 안내', category: '시험', desc: '전 학년 대상 과목별 시험 범위 및 시간표 공지', dateDetected: '2026-09-15', defaultStart: '2026-10-05', defaultEnd: '2026-10-09', isProcessed: false },
            { id: 2, title: '한빛 예술제(학교 축제) 부스 신청', category: '축제', desc: '학급별 및 동아리별 체험 부스 기획서 제출', dateDetected: '2026-09-17', defaultStart: '2026-09-22', defaultEnd: '2026-09-30', isProcessed: false },
            { id: 3, title: '학교 도서관 독후감 대회', category: '행정', desc: '지정 도서 중 1권 읽고 독후감 제출 (상품 증정)', dateDetected: '2026-09-18', defaultStart: '2026-09-20', defaultEnd: '2026-10-10', isProcessed: false }
        ];

        let timelineItems = [
            { id: 101, title: '동아리 하반기 활동 보고서 작성', category: '동아리', startDate: '2026-09-10', endDate: '2026-09-25', desc: '실험 및 연구 내용 정리하여 동아리 담당 선생님께 제출', completed: false }
        ];

        let currentInboxFilter = 'all';
        let currentTimelineFilter = 'all';

        // View Mode: 'yearly' | 'monthly' | 'weekly'
        let currentViewMode = 'monthly';

        // Navigation state anchor date (Default: 2026-09-18)
        let anchorDate = new Date(2026, 8, 18); // September is month 8

        window.onload = function() {
            renderInbox();
            renderTimeline();
        };

        // --- View Mode & Navigation Functions ---
        function setTimelineView(mode) {
            currentViewMode = mode;
            ['yearly', 'monthly', 'weekly'].forEach(m => {
                const btn = document.getElementById(`view-mode-${m}`);
                if (btn) {
                    if (m === mode) {
                        btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-indigo-600 shadow-sm transition';
                    } else {
                        btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-600 transition';
                    }
                }
            });
            renderTimeline();
        }

        function navigateTime(direction) {
            if (currentViewMode === 'yearly') {
                anchorDate.setFullYear(anchorDate.getFullYear() + direction);
            } else if (currentViewMode === 'monthly') {
                anchorDate.setMonth(anchorDate.getMonth() + direction);
            } else if (currentViewMode === 'weekly') {
                anchorDate.setDate(anchorDate.getDate() + (direction * 7));
            }
            renderTimeline();
        }

        function resetToCurrentDate() {
            anchorDate = new Date(2026, 8, 18);
            renderTimeline();
        }

        // Helper: Get start and end of week (Monday to Sunday)
        function getWeekRange(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diffToMonday));
            monday.setHours(0,0,0,0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);
            return { start: monday, end: sunday };
        }

        function updateRangeDisplay() {
            const display = document.getElementById('timeline-range-display');
            const y = anchorDate.getFullYear();
            const m = anchorDate.getMonth() + 1;
            
            if (currentViewMode === 'yearly') {
                display.textContent = `${y}년 (연간)`;
            } else if (currentViewMode === 'monthly') {
                display.textContent = `${y}년 ${m}월`;
            } else if (currentViewMode === 'weekly') {
                const { start, end } = getWeekRange(anchorDate);
                const sMonth = start.getMonth() + 1;
                const sDay = start.getDate();
                const eMonth = end.getMonth() + 1;
                const eDay = end.getDate();
                display.textContent = `${sMonth}/${sDay} ~ ${eMonth}/${eDay}`;
            }
        }

        // --- Inbox Functions ---
        function filterInbox(category) {
            currentInboxFilter = category;
            ['all', '축제', '시험', '동아리', '행정'].forEach(cat => {
                const btn = document.getElementById(`inbox-filter-${cat}`);
                if (btn) {
                    if (cat === category) {
                        btn.className = 'px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white font-bold transition whitespace-nowrap shadow-sm';
                    } else {
                        btn.className = 'px-3.5 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100 font-medium transition whitespace-nowrap border border-slate-200';
                    }
                }
            });
            renderInbox();
        }

        function renderInbox() {
            const listContainer = document.getElementById('inbox-list');
            const countBadge = document.getElementById('inbox-count');
            
            const filtered = inboxItems.filter(item => {
                if (item.isProcessed) return false;
                if (currentInboxFilter === 'all') return true;
                return item.category === currentInboxFilter;
            });

            countBadge.textContent = `${filtered.length}건 대기`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-14">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                        </svg>
                        <p class="text-xs font-semibold text-slate-500">수신된 신규 알림이 없습니다.</p>
                        <p class="text-[11px] text-slate-400 mt-1">우측에서 일정을 직접 추가하거나 관리해보세요!</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = '';
            filtered.forEach(item => {
                const badgeColor = getCategoryColor(item.category);
                const el = document.createElement('div');
                el.className = 'bg-white hover:border-indigo-300 border border-slate-200 rounded-2xl p-4 transition shadow-sm flex flex-col justify-between space-y-2.5 group';
                el.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold px-3 py-1 rounded-full ${badgeColor}">${item.category}</span>
                        <span class="text-xs font-black text-slate-600 bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">수신: ${item.dateDetected}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-900 text-sm group-hover:text-indigo-600 transition">${item.title}</h4>
                        <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.desc}</p>
                    </div>
                    <div class="pt-2 flex justify-end border-t border-slate-100">
                        <button onclick="openSetupModalWithItem(${item.id})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition shadow-sm flex items-center justify-center space-x-1.5">
                            <span>기간 설정 및 등록</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        // --- Custom Add Modal ---
        function openCustomAddModal() {
            document.getElementById('modal-inbox-id').value = '';
            document.getElementById('modal-title').value = '';
            document.getElementById('modal-start-date').value = '2026-09-18';
            document.getElementById('modal-end-date').value = '2026-09-25';
            document.getElementById('modal-category').value = '행정';
            document.getElementById('modal-desc').value = '';

            document.getElementById('setup-modal').classList.remove('hidden');
        }

        function openSetupModalWithItem(id) {
            const item = inboxItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-inbox-id').value = item.id;
            document.getElementById('modal-title').value = item.title;
            document.getElementById('modal-start-date').value = item.defaultStart || '2026-09-18';
            document.getElementById('modal-end-date').value = item.defaultEnd || '2026-09-25';
            document.getElementById('modal-category').value = item.category;
            document.getElementById('modal-desc').value = item.desc;

            document.getElementById('setup-modal').classList.remove('hidden');
        }

        function closeSetupModal() {
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function submitSetupForm(event) {
            event.preventDefault();
            const inboxId = document.getElementById('modal-inbox-id').value;
            const title = document.getElementById('modal-title').value;
            const startDate = document.getElementById('modal-start-date').value;
            const endDate = document.getElementById('modal-end-date').value;
            const category = document.getElementById('modal-category').value;
            const desc = document.getElementById('modal-desc').value;

            if (startDate > endDate) {
                alert('시작일은 마감일보다 빠르거나 같아야 합니다.');
                return;
            }

            const newTimelineItem = {
                id: Date.now(),
                title,
                category,
                startDate,
                endDate,
                desc,
                completed: false
            };

            timelineItems.push(newTimelineItem);

            if (inboxId) {
                inboxItems = inboxItems.map(i => i.id == inboxId ? {...i, isProcessed: true} : i);
            }

            closeSetupModal();
            renderInbox();
            renderTimeline();
        }

        // --- Timeline & D-Day ---
        function filterTimeline(filter) {
            currentTimelineFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`timeline-filter-${f}`);
                if (btn) {
                    if (f === filter) {
                        btn.className = 'px-3 py-1 rounded-lg bg-indigo-600 text-white font-bold transition shadow-sm';
                    } else {
                        btn.className = 'px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition';
                    }
                }
            });
            renderTimeline();
        }

        function toggleCompleteTimeline(id) {
            timelineItems = timelineItems.map(item => item.id === id ? {...item, completed: !item.completed} : item);
            renderTimeline();
        }

        function deleteTimeline(id) {
            timelineItems = timelineItems.filter(item => item.id !== id);
            renderTimeline();
        }

        function calculateDday(startDateStr) {
            const today = new Date(2026, 8, 18);
            today.setHours(0, 0, 0, 0);
            const target = new Date(startDateStr);
            target.setHours(0, 0, 0, 0);
            
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return '시작 D-DAY';
            if (diffDays > 0) return `시작 D-${diffDays}`;
            return `시작 D+${Math.abs(diffDays)}`;
        }

        function renderTimeline() {
            updateRangeDisplay();

            const listContainer = document.getElementById('timeline-list');
            const stats = document.getElementById('timeline-stats');

            const viewingYear = anchorDate.getFullYear();
            const viewingMonth = anchorDate.getMonth();
            const { start: weekStart, end: weekEnd } = getWeekRange(anchorDate);

            const filtered = timelineItems.filter(item => {
                if (currentTimelineFilter === 'active' && item.completed) return false;
                if (currentTimelineFilter === 'completed' && !item.completed) return false;

                const start = new Date(item.startDate);
                const end = new Date(item.endDate);

                if (currentViewMode === 'yearly') {
                    return start.getFullYear() === viewingYear || end.getFullYear() === viewingYear || (start <= new Date(viewingYear, 11, 31) && end >= new Date(viewingYear, 0, 1));
                } else if (currentViewMode === 'monthly') {
                    const startMatch = start.getFullYear() === viewingYear && start.getMonth() === viewingMonth;
                    const endMatch = end.getFullYear() === viewingYear && end.getMonth() === viewingMonth;
                    const viewingDateObj = new Date(viewingYear, viewingMonth, 1);
                    const viewingEndObj = new Date(viewingYear, viewingMonth + 1, 0);
                    const spansMonth = start <= viewingEndObj && end >= viewingDateObj;
                    return startMatch || endMatch || spansMonth;
                } else if (currentViewMode === 'weekly') {
                    return start <= weekEnd && end >= weekStart;
                }
                return true;
            });

            stats.textContent = `해당 기간 일정 ${filtered.length}개`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 mx-auto text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="text-xs font-semibold text-slate-500">선택한 기간에 등록된 일정이 없습니다.</p>
                        <p class="text-[11px] text-slate-400 mt-1">상단의 화살표로 기간을 이동하거나 일정을 추가해보세요.</p>
                    </div>
                `;
                return;
            }

            filtered.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

            listContainer.innerHTML = '';
            filtered.forEach(item => {
                const badgeColor = getCategoryColor(item.category);
                const ddayText = calculateDday(item.startDate);
                const isUrgent = ddayText.includes('D-') && parseInt(ddayText.replace(/[^0-9]/g, '')) <= 3;
                
                let ddayBadgeClass = 'bg-slate-100 text-slate-700 text-sm px-3.5 py-1.5 border border-slate-200';
                if (item.completed) {
                    ddayBadgeClass = 'bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs px-3 py-1 font-bold';
                } else if (ddayText.includes('D-DAY') || isUrgent) {
                    ddayBadgeClass = 'bg-rose-600 text-white text-base px-4 py-1.5 animate-pulse font-black shadow-md shadow-rose-200';
                } else {
                    ddayBadgeClass = 'bg-indigo-100 text-indigo-800 border border-indigo-200 text-sm px-3.5 py-1.5 font-black';
                }

                const el = document.createElement('div');
                el.className = `border rounded-3xl p-5 transition ${item.completed ? 'bg-white opacity-60 border-slate-200' : 'bg-white shadow-sm border-slate-200 hover:border-indigo-300'}`;
                
                el.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-extrabold px-3 py-1 rounded-full ${badgeColor}">${item.category}</span>
                            <span class="rounded-2xl tracking-wide ${ddayBadgeClass}">${item.completed ? '완료됨' : ddayText}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="toggleCompleteTimeline(${item.id})" class="text-xs px-3.5 py-2 rounded-xl border font-bold transition ${item.completed ? 'bg-slate-100 text-slate-600 border-slate-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'}">
                                ${item.completed ? '다시 진행' : '완료하기'}
                            </button>
                            <button onclick="deleteTimeline(${item.id})" class="p-2 text-slate-400 hover:text-rose-600 rounded-xl hover:bg-slate-100 transition" title="삭제">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h4 class="font-bold text-slate-900 text-base ${item.completed ? 'line-through text-slate-400' : ''}">${item.title}</h4>
                        <p class="text-xs text-slate-500 mt-1 leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="mt-4 pt-3.5 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                        <div class="flex items-center space-x-2 font-extrabold text-indigo-700 bg-indigo-50/70 px-3.5 py-2.5 rounded-2xl border border-indigo-100">
                            <span>🚀 시작일:</span>
                            <span class="text-sm font-black text-indigo-900">${item.startDate}</span>
                        </div>
                        <div class="flex items-center space-x-2 font-extrabold text-rose-700 bg-rose-50/70 px-3.5 py-2.5 rounded-2xl border border-rose-100">
                            <span>🏁 마감일:</span>
                            <span class="text-sm font-black text-rose-900">${item.endDate}</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        function getCategoryColor(cat) {
            switch(cat) {
                case '축제': return 'bg-rose-100 text-rose-700 border border-rose-200';
                case '시험': return 'bg-amber-100 text-amber-800 border border-amber-200';
                case '동아리': return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
                case '행정': return 'bg-sky-100 text-sky-800 border border-sky-200';
                default: return 'bg-slate-100 text-slate-700 border border-slate-200';
            }
        }
    </script>

</body>
</html>
