<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>학교 교칙 정리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Fixed Bar -->
  <header class="topbar">
    <div class="wrap">
      <div class="brand-area">
        <a class="home" href="#home" id="homeLink" style="visibility: hidden;">🏫 목차</a>
        <span class="count" id="count"></span>
      </div>
      <div class="actions">
        <button id="themeToggleBtn" class="icon-btn" aria-label="테마 변경">🌙</button>
        <button id="adminToggleBtn" class="btn btn-sm btn-outline">⚙️ 관리자</button>
      </div>
    </div>
  </header>

  <!-- Admin Mode Banner -->
  <div id="adminBanner" class="admin-banner" style="display: none;">
    <div class="wrap admin-banner-content">
      <span>🔓 <strong>관리자 편집 모드 작동 중</strong></span>
      <div class="admin-banner-btns">
        <button id="btnExport" class="btn btn-xs">💾 데이터 백업(JSON)</button>
        <button id="btnImport" class="btn btn-xs">📂 데이터 불러오기</button>
        <button id="btnReset" class="btn btn-xs btn-danger-soft">🔄 초기화</button>
        <button id="btnExitAdmin" class="btn btn-xs btn-outline">🔒 관리자 종료</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none;">

  <main class="wrap main-content">
    <!-- Home View -->
    <section class="page on" id="home">
      <div class="home-header">
        <h1>🏫 학교 교칙 정리</h1>
      </div>

      <!-- Controls & Search -->
      <div class="search-bar">
        <span class="search-ic">🔍</span>
        <input type="text" id="searchInput" placeholder="궁금한 교칙 검색 (예: 지각, 교복, 핸드폰)...">
        <button id="searchClear" class="search-clear" style="display:none;">✕</button>
      </div>

      <!-- Category Tabs -->
      <div class="tabs" id="categoryFilter">
        <button class="tab-btn active" data-filter="all">전체보기</button>
        <button class="tab-btn" data-filter="key">⭐ 필수규정</button>
        <button class="tab-btn" data-filter="new">🔥 신설/개정</button>
        <button class="tab-btn" data-filter="fav">🔖 즐겨찾기</button>
      </div>

      <!-- Category List -->
      <ul class="menu" id="menuList"></ul>

      <!-- Admin Add Category Button -->
      <div id="adminAddCatContainer" style="display: none; margin-top: 20px;">
        <button id="btnAddCategory" class="btn btn-primary full-width">+ 새 카테고리 추가</button>
      </div>
    </section>

    <!-- Dynamic Category Pages rendered by JS -->
    <div id="dynamicPages"></div>

    <!-- Navigation Footer -->
    <nav class="pager" id="pager" aria-label="페이지 이동"></nav>
  </main>

  <!-- Side Navigation Floating Arrows -->
  <button id="prevArrow" class="side-arrow prev-arrow" aria-label="이전 페이지">‹</button>
  <button id="nextArrow" class="side-arrow next-arrow" aria-label="다음 페이지">›</button>

  <!-- Modal Component for Editing -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">편집</h3>
        <button id="modalClose" class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button id="modalCancelBtn" class="btn btn-outline">취소</button>
        <button id="modalSaveBtn" class="btn btn-primary">저장하기</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
